[workspace]
resolver = "3"
members = ["crates/*", "apps/grapnel", "apps/settings", "apps/settings/src-tauri"]
default-members = [
    "crates/grapnel-keys",
    "crates/grapnel-schema",
    "crates/grapnel-config",
    "crates/grapnel-engine",
    "crates/grapnel-win",
    "crates/grapnel-pad",
    "apps/grapnel",
]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
grapnel-keys = { path = "crates/grapnel-keys" }
grapnel-schema = { path = "crates/grapnel-schema" }
grapnel-config = { path = "crates/grapnel-config" }
grapnel-engine = { path = "crates/grapnel-engine" }
grapnel-win = { path = "crates/grapnel-win" }
grapnel-pad = { path = "crates/grapnel-pad" }
serde = { version = "1", features = ["derive"] }
toml = { version = "1", features = ["preserve_order"] }
regex = "1"
rust-i18n = "4.2.2"
# Keeps key order in the config files the settings tool reads and writes.
serde_json = { version = "1", features = ["preserve_order"] }
log = "0.4"
