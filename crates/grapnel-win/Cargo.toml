[package]
name = "grapnel-win"
description = "Win32 backend for grapnel: hooks, SendInput, window info, tray, input box, pipe"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
grapnel-keys.workspace = true
grapnel-config.workspace = true
grapnel-engine.workspace = true
log.workspace = true

[dependencies.windows]
version = "0.62"
features = [
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
