# Emacs 風のカーソル移動・削除・切り取りと貼り付け・マーク。
# 使い方: grapnel.exe --config examples\emacs.toml
# または %APPDATA%\grapnel\config.toml から include = ["...\\emacs.toml"] で読み込む。

# Emacs 本体やターミナルでは Ctrl キーをそのまま使いたい。
# 下のアクションはどれも others のときだけ働くので、それ以外では元のキーがそのまま届く。
[targets.emacs_like_app]
app = "re:(?i)^(emacs|runemacs|WindowsTerminal|wezterm-gui|alacritty|mintty)\\.exe$"

[targets.others]
not = "emacs_like_app"

# 押している間は出力も押したまま (hold) なので、C-f を押し続ければ Right がキーリピートされる。
[keymap]
"C-f" = "forward_char"
"C-b" = "backward_char"
"C-n" = "next_line"
"C-p" = "previous_line"
"C-a" = "beginning_of_line"
"C-e" = "end_of_line"
"C-h" = "delete_backward_char"
"C-d" = "delete_char"
# Windows にはキルリングやマークが無いので、選択範囲とクリップボードで代用する。
"C-k" = "kill_line"
"C-w" = "kill_region"
"M-w" = "kill_ring_save"
"C-y" = "yank"
"C-/" = "undo"
"C-Space" = "set_mark"

# マーク中は Shift を押したままにするので、移動すると選択範囲が広がる
# (キーマップに無い Ctrl+→ や PageDown なども同様)。
# キーマップに無い入力 (文字入力・クリックなど) が来たら、Shift を離してからその入力を送り、マークを解除する。
[modes.mark]
unmapped_to = "default"
hold = "S"

[modes.mark.keymap]
"C-Space" = "deactivate_mark"
"C-g" = "deactivate_mark"
"C-f" = "select_forward_char"
Right = "select_forward_char"
"C-b" = "select_backward_char"
Left = "select_backward_char"
"C-n" = "select_next_line"
Down = "select_next_line"
"C-p" = "select_previous_line"
Up = "select_previous_line"
"C-a" = "select_beginning_of_line"
Home = "select_beginning_of_line"
"C-e" = "select_end_of_line"
End = "select_end_of_line"
# 編集系はいつもの動作をしてからマークを解除する。
"C-w" = "mark_kill_region"
"M-w" = "mark_kill_ring_save"
"C-y" = "mark_yank"
"C-k" = "mark_kill_line"
"C-h" = "mark_delete_backward_char"
"C-d" = "mark_delete_char"
"C-/" = "mark_undo"

[actions]
forward_char = { others = "Right" }
backward_char = { others = "Left" }
next_line = { others = "Down" }
previous_line = { others = "Up" }
beginning_of_line = { others = "Home" }
end_of_line = { others = "End" }
delete_backward_char = { others = "Backspace" }
delete_char = { others = "Delete" }
# 行末まで選択して切り取る。
# 注意: 行末で押すと選択が空になり、VS Code などは Ctrl+X で行全体を切り取る。
kill_line = { others = "S-End C-x" }
kill_region = { others = "C-x" }
kill_ring_save = { others = "C-c" }
yank = { others = "C-v" }
undo = { others = "C-z" }

set_mark = { others = [{ mode = "mark" }] }
deactivate_mark = [{ mode = "default" }]
select_forward_char = { others = "S-Right" }
select_backward_char = { others = "S-Left" }
select_next_line = { others = "S-Down" }
select_previous_line = { others = "S-Up" }
select_beginning_of_line = { others = "S-Home" }
select_end_of_line = { others = "S-End" }
mark_kill_region = [{ call = "kill_region" }, { mode = "default" }]
mark_kill_ring_save = [{ call = "kill_ring_save" }, { mode = "default" }]
mark_yank = [{ call = "yank" }, { mode = "default" }]
mark_kill_line = [{ call = "kill_line" }, { mode = "default" }]
mark_delete_backward_char = [{ call = "delete_backward_char" }, { mode = "default" }]
mark_delete_char = [{ call = "delete_char" }, { mode = "default" }]
mark_undo = [{ call = "undo" }, { mode = "default" }]
