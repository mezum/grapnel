# JIS 配列のキーボードで AX 配列の記号を打つ (Windows のキーボード配列は日本語 106/109 のまま)。
# 素の打鍵と Shift+ だけを置き換える。Ctrl などとの組み合わせは JIS のまま。
# 「ロ」のキーは AX の \ ではなく、Shift の有無にかかわらず _ にしている。
# JIS と同じ記号になるキー (! # $ % ¥ | ; , < . > / ? など) は書いていない。
# 行末のコメントは打てる文字。

[keymap]
"S-2" = "@"       # @
"S-6" = "^"       # ^
"S-7" = "S-6"     # &
"S-8" = "S-:"     # *
"S-9" = "S-8"     # (
"S-0" = "S-9"     # )
"S--" = "S-_"     # _
"^" = "S--"       # =
"S-^" = "S-;"     # +
"@" = "["         # [
"S-@" = "S-["     # {
"[" = "]"         # ]
"S-[" = "S-]"     # }
"S-;" = ":"       # :
":" = "S-7"       # '
"S-:" = "S-2"     # "
"]" = "S-@"       # `
"S-]" = "S-^"     # ~
"_" = "S-_"       # _
