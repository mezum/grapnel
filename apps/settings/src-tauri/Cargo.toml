[package]
name = "grapnel-settings"
description = "Settings editor for grapnel"
edition.workspace = true
version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
# Tauri reads command arguments through serde_json::Value; keep key order (keymap, targets).
serde_json = { version = "1", features = ["preserve_order"] }
grapnel-config.workspace = true
grapnel-keys.workspace = true
grapnel-schema.workspace = true
grapnel-win.workspace = true
tauri-plugin-dialog = "2"
rust-i18n = "4.2.2"
