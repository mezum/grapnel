[package]
name = "grapnel"
description = "Tray-resident input remapper for Windows"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
grapnel-keys.workspace = true
grapnel-config.workspace = true
grapnel-engine.workspace = true
grapnel-win.workspace = true
grapnel-pad.workspace = true
log.workspace = true
rust-i18n = "4.2.2"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
toml.workspace = true
regex.workspace = true
