name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches the version
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq grapnel).version
          if ("v$version" -ne $env:TAG) { throw "tag $env:TAG does not match version $version in Cargo.toml" }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli
      - run: cargo build --release -p grapnel
      - run: cargo tauri build --no-bundle
        working-directory: apps/settings
      - name: Package
        shell: pwsh
        run: |
          $name = "grapnel-$env:TAG-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/grapnel.exe, target/release/grapnel-settings.exe $name
          Copy-Item README.md, README.en.md, LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY_NOTICES.md $name
          Copy-Item -Recurse examples $name
          Compress-Archive $name "$name.zip"
      - run: gh release create $env:TAG "grapnel-$env:TAG-windows-x64.zip" --verify-tag --generate-notes --title $env:TAG
        shell: pwsh
